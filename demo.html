<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigvo — workspace (prototype)</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="brand.css">
<meta name="robots" content="noindex">
<style>
:root{--bg:#FFFFFF;--bg2:#F5F5F2;--bg3:#ECECE7;--line:#E2E2DC;--line2:#EDEDE8;--tx:#111110;--mut:#5C5C57;--mut2:#8C8C85;
 --top:#111110;--toptx:#E9E9E4;--topmut:#A6A69F;--top2:#1F1F1D;--topline:#2C2C29;
 --a:#FFD400;--atx:#111110;--abg:#FFF5C7;--abd:#EED36A;--asel:#FFFBE6;--gold:#8A6D00;
 --g:#1F7A45;--gbg:#E9F5EE;--gbd:#C6E3D1;--gd:#22A04B;
 --o:#9A4A06;--obg:#FFF3E3;--obd:#F8D9AE;--od:#F08C1A;
 --r:#B42318;--rbg:#FDECEC;--rbd:#F6C6C2;--rd:#E5372B;
 --b:#1D4ED8;--bbg:#EAF1FF;--bbd:#C9D8FB;--bd:#3B6FE8;
 --card:#FFFFFF;--sh:0 10px 30px rgba(17,17,16,.14)}
:root[data-theme="dark"]{--bg:#141413;--bg2:#1B1B19;--bg3:#232321;--line:#2E2E2B;--line2:#262624;--tx:#EDEDE8;--mut:#A9A9A2;--mut2:#7E7E78;
 --top:#0B0B0A;--top2:#1A1A18;--topline:#262624;
 --abg:#3A3209;--abd:#5E5112;--asel:#252107;--gold:#FFD400;
 --g:#7FD3A2;--gbg:#15301F;--gbd:#24503A;--o:#F5B66A;--obg:#33240F;--obd:#5A3F17;--r:#F59A92;--rbg:#3A1715;--rbd:#5C2420;--b:#93B4FF;--bbg:#15213D;--bbd:#26386A;--card:#1B1B19;--sh:0 10px 30px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
body{font:14px/1.42 "Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.mut{color:var(--mut)}.o-t{color:#C26A0A}.r-t{color:var(--rd)}.g-t{color:var(--g)}
:root[data-theme="dark"] .o-t{color:var(--o)}
/* top (dark) */
.top{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--top);color:var(--toptx);position:relative;z-index:30}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;letter-spacing:-.02em;color:#fff}
.logo i{font-style:normal;width:30px;height:30px;border-radius:7px;background:var(--a);color:#111;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.ws{padding:6px 10px;border-radius:9px;display:flex;gap:10px;align-items:center;border:1px solid var(--topline);text-align:left;line-height:1.15}
.ws:hover{background:var(--top2)}.ws small{display:block;color:var(--topmut);font-size:11.5px}
.secnav{flex:1;display:flex;justify-content:center;gap:2px;align-self:stretch}
.secnav button{padding:0 16px;font-size:15px;color:var(--topmut);border-bottom:3px solid transparent}
.secnav button:hover{color:#fff;background:var(--top2)}
.secnav button.on{color:#fff;font-weight:600;background:var(--top2);border-bottom-color:var(--a)}
.tright{display:flex;align-items:center;gap:4px}
.ib{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.top .ib:hover{background:var(--top2)}
.ib .bdot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--a);border:2px solid var(--top)}
.lang{padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--toptx);display:inline-flex;gap:4px;align-items:center}.lang:hover{background:var(--top2)}
.me{width:38px;height:38px;border-radius:50%;border:1px solid var(--topline);background:var(--top2);font-weight:700;font-size:13px;color:#fff}
.demo{position:absolute;right:18px;top:52px;background:var(--a);color:#111;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:0 0 8px 8px;z-index:31}
/* sub */
.sub{height:50px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.sub .pg{height:50px;padding:0 12px;font-size:15px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sub .pg:hover{color:var(--tx)}
.sub .pg.on{color:var(--tx);font-weight:600;border-bottom-color:var(--a)}
.sub .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--a);border-color:var(--a);color:var(--atx);font-weight:600}
.btn.pri:hover{background:#F5CB00}
.btn.ink{background:var(--tx);border-color:var(--tx);color:var(--bg);font-weight:600}
.btn.soft{background:var(--abg);border-color:var(--abd);color:var(--tx);font-weight:600}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn.wide{width:100%;justify-content:center;padding:12px}
.btn.danger{color:var(--r);border-color:var(--rbd)}
/* tabsbar */
.tabsbar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 18px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto}
.ot{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:nowrap;cursor:pointer}
.ot.on{background:var(--abg);border-color:var(--abd);font-weight:600}
.ot .x{opacity:.55;display:inline-flex}.ot .x:hover{opacity:1}.ot .x svg.i{width:14px;height:14px}
.tcap{font-size:12px;color:var(--mut2);margin-left:4px;white-space:nowrap}
/* layout */
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.wrap.dr{grid-template-columns:minmax(0,1fr) 440px}
.main{padding:22px 24px 80px;min-width:0;overflow:auto;min-height:0}
.drawer{border-left:1px solid var(--line);background:var(--bg);overflow:auto;min-height:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{margin:0;font-size:32px;letter-spacing:-.03em;line-height:1.15;font-weight:700}
.ph .date{font-size:16px;color:var(--mut);margin-left:14px;font-weight:400;letter-spacing:0}
.ph .line{margin-top:8px;color:var(--mut);font-size:15px}
.ph .grow{flex:1;min-width:260px}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--mut);font-size:14px}.back:hover{color:var(--tx)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{padding:8px 16px;border-right:1px solid var(--line);font-size:14.5px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
.itabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow-x:auto}
.itabs button{padding:9px 12px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;font-size:14.5px}
.itabs button.on{color:var(--tx);font-weight:600;border-bottom-color:var(--a)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14.5px;white-space:nowrap}
.chip:hover{background:var(--bg2)}
.chip.on{background:var(--abg);border-color:var(--abd);font-weight:600}
.cnt{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--od);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cnt.n{background:var(--bg3);color:var(--mut)}.cnt.y{background:var(--a);color:#111}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tb{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14px;white-space:nowrap}
.tb:hover{background:var(--bg2)}.tb.on{border-color:var(--abd);background:var(--abg)}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--bg);min-width:230px}
.srch input{border:0;outline:0;background:none;padding:8px 0;width:100%}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--abd);background:var(--abg);border-radius:10px;margin-bottom:14px}
/* table */
.tw{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--card)}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-weight:600;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px;position:sticky;top:0;background:var(--card);z-index:1}
.t th.s{cursor:pointer}.t th.s:hover{color:var(--gold)}
.t td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--bg2)}
.t tbody tr.sel td{background:var(--asel)}
.t td.r,.t th.r{text-align:right}
.t .grp td{background:var(--bg2);font-weight:600;color:var(--mut);font-size:13px;cursor:default}
body.compact .t td{padding:6px 14px}body.compact .t th{padding:9px 14px}body.compact .t .t2{display:none}
.t1{font-size:15px}.t2{font-size:13.5px;color:var(--mut)}
.cb{width:20px;height:20px;border:1.6px solid #9A9A93;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg)}
.cb.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.cb.on svg.i{width:14px;height:14px;stroke-width:2.6}
.av{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--bg2);flex:0 0 auto}
.who{display:flex;align-items:center;gap:10px}
.dots{width:34px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}.dots:hover{background:var(--bg3)}
.st{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.g{background:var(--gd)}.dot.o{background:var(--od)}.dot.r{background:var(--rd)}.dot.b{background:var(--bd)}.dot.n{background:#A8A8A1}.dot.y{background:var(--a)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13.5px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.pill.g{background:var(--gbg);color:var(--g);border-color:var(--gbd)}
.pill.o{background:var(--obg);color:var(--o);border-color:var(--obd)}
.pill.r{background:var(--rbg);color:var(--r);border-color:var(--rbd)}
.pill.b{background:var(--bbg);color:var(--b);border-color:var(--bbd)}
.pill.y{background:var(--abg);color:var(--tx);border-color:var(--abd)}
.pill.sm{font-size:12.5px;padding:2px 9px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--bg3);color:var(--mut);font-size:12px;font-weight:600}
/* cards */
.card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px 18px}
.card h3{margin:0 0 10px;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.lnk{font-size:14px;font-weight:500;color:var(--b);text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:16px}
.k{padding:16px 22px;border-right:1px solid var(--line2)}.k:last-child{border-right:0}
.k .l{color:var(--mut);font-size:15px}.k .v{font-size:32px;font-weight:700;letter-spacing:-.03em;margin-top:4px}.k .d{font-size:13px;margin-top:2px}
.k.ink{background:var(--tx);color:var(--bg);border-radius:12px 0 0 12px}.k.ink .l{color:var(--mut2)}.k.ink .v{color:var(--a)}
.stack{display:flex;flex-direction:column;gap:16px}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.lrow:first-of-type{border-top:0}.lrow .grow{flex:1;min-width:0}
.icb{width:38px;height:38px;border-radius:50%;background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar{height:8px;border-radius:5px;background:var(--bg3);overflow:hidden}.bar i{display:block;height:100%;background:var(--gd);border-radius:5px}
.bar.o i{background:var(--od)}.bar.r i{background:var(--rd)}.bar.y i{background:var(--a)}
.feat{border:1px dashed var(--line);border-radius:12px;padding:16px 18px;background:var(--bg2)}
.feat h4{margin:0 0 4px;font-size:16px}
.feat .fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.feat .fl span{padding:5px 10px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-size:13.5px}
.note{padding:10px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:13.5px}
/* drawer */
.dh{padding:20px 22px 0}.dh .tt{display:flex;align-items:flex-start;gap:12px}
.dh h2{margin:0;font-size:27px;letter-spacing:-.02em;line-height:1.15;flex:1}
.dh .s{color:var(--mut);margin-top:4px;font-size:15px}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 22px 0}
.dtabs button{padding:9px 12px;color:var(--mut);border-bottom:3px solid transparent;font-size:15px}
.dtabs button.on{color:var(--tx);font-weight:600;border-bottom-color:var(--a)}
.db{padding:14px 22px;flex:1}
.df{padding:12px 22px 18px;display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line2)}
.kv{display:flex;gap:14px;padding:9px 0}.kv .ic{color:var(--mut);padding-top:1px}.kv .grow{flex:1}
.kv .v{font-size:15.5px}.kv .h{font-size:13.5px;color:var(--mut)}
.sect{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.sect h4{margin:0 0 8px;font-size:16px;display:flex;align-items:center}.sect h4 .sp{flex:1}.sect h4 small{font-weight:400;color:var(--mut);font-size:13px}
.ck{display:flex;align-items:center;gap:12px;padding:7px 0}.ck .grow{flex:1}.ck .w{color:var(--mut);font-size:13.5px;white-space:nowrap}
.okc{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.okc svg.i{width:13px;height:13px;stroke-width:3}
.okc.g{background:var(--gd)}.okc.o{background:var(--od)}.okc.r{background:var(--rd)}.okc.n{background:var(--bg3)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--obg);border:1px solid var(--obd);margin:12px 0}
.alert.r{background:var(--rbg);border-color:var(--rbd)}.alert.g{background:var(--gbg);border-color:var(--gbd)}
.alert .grow{flex:1}.alert b{color:var(--o)}.alert.r b{color:var(--r)}.alert.g b{color:var(--g)}
.alert .h{font-size:13px;color:var(--mut)}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0}.prow .grow{flex:1;min-width:0}.prow .ph2{color:var(--mut);font-size:14px;white-space:nowrap}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:13px;color:var(--mut)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--tx)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
/* pop / modal */
.pop{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;min-width:230px;max-height:72vh;overflow:auto}
.pop .pi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;width:100%;text-align:left;font-size:14.5px}
.pop .pi:hover{background:var(--bg2)}.pop .pi.on{font-weight:600;background:var(--abg)}
.pop .ph3{padding:8px 12px 4px;font-size:12px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em}
.pop hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
.ov{position:fixed;inset:0;background:rgba(10,10,9,.42);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px}
.modal{background:var(--bg);border-radius:14px;box-shadow:var(--sh);width:min(640px,100%);max-height:80vh;overflow:auto}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh input{flex:1;border:0;outline:0;font-size:17px;background:none}
.modal .mb{padding:10px 10px 14px}
.sr{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}.sr:hover{background:var(--bg2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111110;color:#fff;padding:11px 18px;border-radius:10px;z-index:90;font-size:14px;box-shadow:var(--sh);max-width:90vw;border-left:4px solid var(--a)}
.fab{position:fixed;right:18px;bottom:18px;z-index:25;width:46px;height:46px;border-radius:50%;background:var(--tx);color:var(--a);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.col h5{margin:2px 4px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.bc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.bc:hover{border-color:var(--abd)}
/* schedule */
.sch{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:var(--card)}
.sd{border-right:1px solid var(--line);min-height:420px}.sd:last-child{border-right:0}
.sd .sdh{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between}
.sd .sdh.today{background:var(--tx);color:var(--a)}
.sd .lab{padding:8px 12px 2px;font-size:12px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.sb{margin:6px 10px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:var(--bg)}.sb:hover{border-color:var(--abd);background:var(--asel)}
.sb .tl{font-weight:600}.sb .h{font-size:13px;color:var(--mut)}
.slot{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:4px}.slot.free{color:#B45309}
.lg{margin:6px 10px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg2);cursor:pointer}
/* pick */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-bottom:18px}
.pc{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);cursor:pointer}.pc:hover{border-color:var(--abd)}
.h5{font-size:13px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px;font-weight:600}
.pitem{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}

function svgBars(cats,a,b,unit,h=220){const W=760,H=h,L=40,B=28,T=14;const mx=Math.max(...a,...(b||[0]))*1.12||1;const n=cats.length;const gw=(W-L-10)/n;const bw=b?gw*.32:gw*.5;const y=v=>H-B-(v/mx)*(H-B-T);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="chart" style="display:block">`;[0,.5,1].forEach(f=>{const v=mx*f/1.12;s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mut2)">${Math.round(v*10)/10}</text>`});
 cats.forEach((c,i)=>{const x=L+i*gw+gw/2;if(b){s+=`<rect x="${x-bw-2}" y="${y(a[i])}" width="${bw}" height="${H-B-y(a[i])}" rx="3" fill="var(--bg3)" stroke="var(--line)"><title>${c}: ${a[i]} ${unit}</title></rect><rect x="${x+2}" y="${y(b[i])}" width="${bw}" height="${H-B-y(b[i])}" rx="3" fill="var(--a)"><title>${c}: ${b[i]} ${unit}</title></rect><text x="${x+2+bw/2}" y="${y(b[i])-5}" font-size="11" text-anchor="middle" fill="var(--tx)">${b[i]}</text>`}else{s+=`<rect x="${x-bw/2}" y="${y(a[i])}" width="${bw}" height="${H-B-y(a[i])}" rx="3" fill="${a[i]>=90?'var(--rd)':'var(--tx)'}"><title>${c}: ${a[i]} ${unit}</title></rect><text x="${x}" y="${y(a[i])-5}" font-size="11" text-anchor="middle" fill="var(--tx)">${a[i]}</text>`}s+=`<text x="${x}" y="${H-9}" font-size="12" text-anchor="middle" fill="var(--mut)">${c}</text>`});return s+'</svg>'}
function statKit(id,title,cats,a,b,unit,small){const k=st.sk[id]||(st.sk[id]={per:'Year',cmp:'Year ago',view:'By month'});const cmpOn=b&&k.cmp!=='None';
 return `<div class="card"><h3>${title}<span class="sp"></span>${cmpOn?`<span class="mut" style="font-size:13px;font-weight:400"><span style="color:var(--mut2)">■</span> ${k.cmp.toLowerCase()} &nbsp; <span style="color:#E6B800">■</span> current</span>`:''}</h3>
 ${small?'':`<div class="tools" style="margin-bottom:8px">${['Month','Quarter','Year','All time','Custom…'].map(x=>`<button class="tb ${k.per===x?'on':''}" data-a="sk:${id}:per:${x}">${x}</button>`).join('')}${b?`<span class="mut" style="margin:0 4px 0 8px">Compare</span><span class="seg">${['Previous','Year ago','Custom','None'].map(x=>`<button class="${k.cmp===x?'on':''}" data-a="sk:${id}:cmp:${x}">${x}</button>`).join('')}</span>`:''}<span class="seg" style="margin-left:auto">${['By month','A vs B'].map(x=>`<button class="${k.view===x?'on':''}" data-a="sk:${id}:view:${x}">${x}</button>`).join('')}</span></div>`}
 ${svgBars(cats,cmpOn?a:(b||a),cmpOn?b:null,unit)}</div>`}
function ltvBody(){const rows=[['Atlas Studio','Referral',24,'€186k','€61k','33%','+14%'],['Nordlicht Events','Google Ads',17,'€142k','€44k','31%','+22%'],['Vistula Congress','Tender',9,'€128k','€35k','27%','+6%'],['Brightside Agency','Instagram',21,'€97k','€33k','34%','+9%'],['Forum Group','Referral',11,'€58k','€20k','34%','−4%']];
 return `<div class="gk"><div class="k ink"><div class="l">Avg net LTV</div><div class="v">€9.4k</div><div class="d g-t">+12% vs last year</div></div><div class="k"><div class="l">Avg gross LTV</div><div class="v">€28.6k</div><div class="d g-t">+9%</div></div><div class="k"><div class="l">Client margin</div><div class="v">33%</div><div class="d g-t">+1 pp</div></div><div class="k"><div class="l">Top-10 share</div><div class="v">38%</div><div class="d mut">of revenue</div></div></div>
 <div class="itabs" style="margin-top:0">${['Overview','Segments','Sources','Cohorts','Data quality'].map((x,i)=>`<button class="${(st.sk.ltvT||0)===i?'on':''}" data-a="ltvt:${i}">${x}</button>`).join('')}</div>
 <div class="g2">${statKit('ltv','Avg net LTV by lead source, k€',['Referral','Tenders','Google Ads','Instagram','Unknown'],[12.6,10.9,7.1,5.2,4.0],[14.2,11.8,8.6,6.1,4.3],'k€')}
 <div class="card" style="padding:0"><table class="t"><thead><tr>${['Client','Source','Events','Gross','Net','Margin','vs LY'].map((x,i)=>`<th class="s ${i>1?'r':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-a="pg:clients">${r.map((c,i)=>`<td class="${i>1?'r':''} ${i===6?(c.startsWith('−')?'r-t':'g-t'):''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}

function pickPage(){const p=P('pick');if(p.full){const r=PICKS.find(x=>x.id===p.full);if(r)return pickFull(r)}const f=p.f.day||'7 days';const items=PICKS.filter(x=>(p.view!=='my'||x.mine)&&(!p.f.state||x.stg[1]===p.f.state));
 const secs=[['start','⏸ Started — finish'],['tom','Tomorrow'],['week','Next 7 days'],['ret','↩ Returns']];
 return head({title:'Picking',date:'Thursday, 8 October',line:`5 picks in 7 days &nbsp;•&nbsp; <span class="r-t">1 with an issue</span> &nbsp;•&nbsp; 1 return`,right:`<button class="btn ink" data-a="toast:QR scanner opened">${ic('qr')} Scan QR</button>`})+

 secs.map(s=>{const L=items.filter(x=>x.sec===s[0]);return L.length?`<div class="h5">${s[1]} · ${L.length}</div><div class="pcards">${L.map(pickCard).join('')}</div>`:''}).join('')+
 `<div class="h5">Pre-pick — quote not confirmed yet · 1</div><div class="pcards"><div class="pc" style="opacity:.8">${two('<b style="font-weight:600">Trade fair</b>','Nordlicht Events · Q-1032')}<div class="mut" style="font-size:13.5px;margin-top:6px">24.10 · ${pill('Not confirmed','sm')}</div></div></div>`}

 <div class="full"><div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="flex:1">${bar(r.got/r.need*100,'o')}</div><b>${r.got} / ${r.need}</b></div>${r.prob?`<div class="alert r">${ic('warn',20)}<div class="grow"><b>Not found: wireless mic Shure ×2</b><div class="h">Robert L. · 06:55 · manager notified</div></div><a class="lnk" data-a="modal:partner">Sub-rent ${ic('arrow',16)}</a></div>`:''}<div class="chips" style="margin:8px 0">${['6 left','All','Issues'].map((x,i)=>`<button class="chip ${i===0?'on':''}" data-a="toast:${x}">${x}</button>`).join('')}</div>${PICKITEMS.map(x=>`<div class="pitem"><span class="cb ${x[2]>=x[1]?'on':''}">${x[2]>=x[1]?ic('check'):''}</span><div style="flex:1">${two(x[0],x[3])}</div><span class="qty"><button data-a="toast:−1" aria-label="minus">−</button><span>${x[2]}/${x[1]}</span><button data-a="toast:+1" aria-label="plus">+</button></span></div>`).join('')}<button class="btn sm" style="margin-top:10px" data-a="toast:Extra item added">${ic('plus',16)} Add extra equipment</button></div>
 <div class="stack sticky"><div class="card"><h3>Event</h3><div class="lrow"><span class="grow">Venue</span><b>Spreehalle, Hall 2</b></div><div class="lrow"><span class="grow">Manager</span><b>Anna Weber</b></div><div class="lrow"><span class="grow">Departure</span><b>07:30 · VW Crafter</b></div></div><div class="card"><h3>Change log</h3><div class="lrow"><div class="grow">${two('Manager added 2 × Robe moving heads','07.10 18:20 · Anna')}</div><button class="btn sm" data-a="toast:Checked">Checked</button></div></div></div></div>`}

 const evOn=d=>EVENTS.filter(e=>e.d===d&&(p.f.mine!=='1'||e.my));

 const body=[()=>`<div class="g2"><div class="card"><h3>Event</h3><div class="kv"><span class="ic">${ic('cal',20)}</span><div class="grow"><div class="v">${r.d} · ${r.time}</div><div class="h">${({Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday',Mon:'Monday',Wed:'Wednesday'})[r.dw]}</div></div></div><div class="kv"><span class="ic">${ic('pin',20)}</span><div class="grow"><div class="v">${esc(r.place)}</div><div class="h">${esc(r.addr)}</div></div></div><div class="kv"><span class="ic">${ic('user',20)}</span><div class="grow"><div class="v">Manager: ${PEO[r.m][0]}</div><div class="h">${PEO[r.m][2]}</div></div></div></div>
  <div class="card"><h3>Event readiness</h3>${r.ready.map(x=>`<div class="ck">${okc(x[0])}<span class="grow">${x[1]}</span><span class="w">${x[2]}</span></div>`).join('')}${r.warn?`<div class="alert ${r.warnR?'r':''}">${ic('warn',20)}<div class="grow"><b>${r.warn}</b><div class="h">${r.warnR?'Assign people in the schedule — the quote is already approved.':'Pick a replacement from available stock.'}</div></div><a class="lnk" data-a="${r.warnR?'modal:slot':'toast:Replacement: Sennheiser EW-D ×2 free on 08.10'}">${r.warnR?'Assign':'Find replacement'} ${ic('arrow',16)}</a></div>`:''}</div></div>
  <div class="card" style="margin-top:16px"><h3>Crew on site<span class="sp"></span><span class="mut" style="font-size:13px;font-weight:400">${r.team.length} people</span></h3>${r.team.map(k=>`<div class="prow">${av(PEO[k][3])}<div class="grow">${two(PEO[k][0],k===r.m?'Project manager':PEO[k][1])}</div><span class="ph2">${PEO[k][2]}</span></div>`).join('')}</div>`,
  ()=>`<div class="card"><h3>Crew<span class="sp"></span><button class="btn sm" data-a="modal:slot">${ic('plus',16)} Assign person</button></h3>${r.team.map(k=>`<div class="prow">${av(PEO[k][3])}<div class="grow">${two(PEO[k][0],PEO[k][1])}</div>${pill('confirmed','g sm')}</div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Rate the crew after the event</h3><div class="mut">Technical quality · Client rating · Punctuality · Discipline · Teamwork (1–5), incidents, damage, manager comment → “Crew ratings”.</div></div>`,
  ()=>`<div class="g2"><div class="card" style="padding:0"><table class="t"><tbody>${[['Invoice total (net)',r.sum],['VAT 19%',-r.tax],['Sub-rental',-r.sub],['Transport',-r.tr],['Crew',-r.crew],[`Manager ${r.mp}%`,-r.sum*r.mp/100]].map(x=>`<tr style="cursor:default"><td>${x[0]}</td><td class="r">${eur(x[1])}</td></tr>`).join('')}<tr style="cursor:default"><td><b>Margin</b></td><td class="r"><b>${eur(R)}</b> <span class="mut">· ${Math.round(R/r.sum*100)}%</span></td></tr></tbody></table></div>
   <div class="stack"><div class="card"><h3>Payment & documents</h3><div class="ck">${okc(r.pay[0]==='g'?'g':'o')}<span class="grow">${r.pay[1]}</span><span class="w">invoice 2026-1185 · Lexware Office</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn sm" data-a="modal:invreq">Request invoice</button><button class="btn sm" data-a="toast:Marked as sent">📤 Sent to client</button></div></div>
   <div class="card"><h3>Management review</h3>${r.chk==='ok'?`<div class="alert g">${ic('check',20)}<div class="grow"><b>✓ Reviewed · Max, 07.10</b><div class="h">Manager commission is payable</div></div></div>`:r.chk==='fail'?`<div class="alert r">${ic('x',20)}<div class="grow"><b>✗ Failed review</b><div class="h">Sub-rental not entered. Fix by 09.10 — task created for the manager.</div></div></div>`:`<div class="note">Not reviewed yet. Commission becomes payable only after review.</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm soft" data-a="toast:✓ Reviewed">✓ Reviewed</button><button class="btn sm danger" data-a="modal:evfail">✗ Failed</button></div>`}</div></div></div>`,
  ()=>`<div class="card">${[['08.10, 06:55','Robert L.','Picking 18/24, issue: wireless mics ×2'],['07.10, 16:05','Viktor H.','Assigned crew (4 people)'],['07.10, 14:20','Client','Approved quote online · 3 views, 6 min'],['06.10, 11:30','Anna W.','Created event from quote']].map(x=>`<div class="lrow"><span class="icb">${ic('clock',18)}</span><div class="grow">${two(x[2],`${x[0]} · ${x[1]}`)}</div></div>`).join('')}</div>`];
 return `<div class="ph"><div class="grow"><button class="back" data-a="back">${ic('left',16)} All events</button><h1 style="margin-top:6px">${r.t} <span class="date">${r.cl} · ${r.id}</span></h1><div style="margin-top:8px;display:flex;gap:12px">${dp(r.prep[0],r.prep[1])}${dp(r.pay[0],r.pay[1],r.pay[2]!==0)}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="toast:List without prices">🖨 List without prices</button><button class="btn" data-a="modal:closeev">Close event</button><button class="btn pri" data-a="${prim[1]}">${prim[0]}</button></div></div>${itabsD(tabs,t)}${body[t]()}`}

function head(o){return `<div class="ph"><div class="grow"><h1>${o.title}${o.date?`<span class="date">${o.date}</span>`:''}</h1>${o.line?`<div class="line">${o.line}</div>`:''}</div>${o.right?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${o.right}</div>`:''}</div>`}
function itabs(t,cur){return `<div class="itabs">${t.map((x,i)=>`<button class="${cur===i?'on':''}" data-a="tab:${i}">${x}</button>`).join('')}</div>`}
function rowsOf(c,p){let R=c.rows.slice();const v=(c.views||[]).find(x=>x[0]===p.view);if(v&&v[2])R=R.filter(v[2]);
 for(const k in p.f){const val=p.f[k];if(!val)continue;const fd=(c.filters||[]).find(f=>f[0]===k);if(!fd||!fd[3])continue;
  R=R.filter(r=>{const rv=r[k];if(rv==null){if(k==='pk')return r.prep&&r.prep[1].startsWith(val);if(k==='stt')return r.st&&r.st[1]===val;return true}return Array.isArray(rv)?rv[1]===val:String(rv)===val})}
 if(p.q){const q=p.q.toLowerCase();R=R.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}
